name: Import quality system

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-quality-system.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download clean quality system
        run: |
          set -e
          base='https://raw.githubusercontent.com/ffgebel/kut-yazboz/main/kalite-yonetim'
          curl -fsSL "$base/index.html" -o index.html
          curl -fsSL "$base/styles.css" -o styles.css
          for i in 1 2 3 4 5 6 7; do curl -fsSL "$base/app-part-$i.js" -o "app-part-$i.js"; done
      - name: Commit imported system
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app-part-*.js
          git diff --cached --quiet || git commit -m 'Add empty SANKO quality management system'
          git push
